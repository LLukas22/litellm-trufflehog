name: Publish to PyPI

# Triggered by publishing a GitHub release (tag must be v<version>, matching
# the version in pyproject.toml). Uses PyPI Trusted Publishing (OIDC) - no API
# token stored in the repo. Configure this workflow as a trusted publisher for
# the project at https://pypi.org/manage/project/litellm-trufflehog/settings/publishing/

on:
  release:
    types: [published]

jobs:
  check-version:
    name: Verify tag matches pyproject version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare release tag to pyproject.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$tag" != "$version" ]; then
            echo "Release tag '${GITHUB_REF_NAME}' does not match pyproject.toml version '${version}'" >&2
            exit 1
          fi

  wheel:
    name: Build manylinux wheel
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build and verify wheel
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/build-wheel.Dockerfile
          outputs: type=local,dest=dist
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: wheel
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
