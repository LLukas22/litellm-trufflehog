# Example LiteLLM proxy configuration using litellm-trufflehog.
#
# Run with:
#   litellm --config examples/config.yaml
#
# Then send a request that contains a credential and watch it get blocked:
#   curl -s http://0.0.0.0:4000/v1/chat/completions \
#     -H 'Content-Type: application/json' \
#     -H 'Authorization: Bearer sk-1234' \
#     -d '{"model":"gpt-4o-mini",
#          "messages":[{"role":"user","content":"debug this: ghp_<a real-looking token>"}],
#          "guardrails":["trufflehog"]}'

model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

guardrails:
  # Scan prompts on the way in. `pre_call` is the only mode that can rewrite the
  # request, so it is required if on_detection is `redact`.
  - guardrail_name: trufflehog
    litellm_params:
      guardrail: litellm_trufflehog.TrufflehogGuardrail
      mode: pre_call
      default_on: true

      # block  - reject the call (default)
      # redact - mask the secrets and continue
      # log    - warn and allow through
      on_detection: block

      # minimal (~34 detectors) | core (~128, default) | all (~858)
      profile: core

      # Add or remove detectors using trufflehog's own selector syntax.
      # detectors: ["Vercel", "Notion", "Github.v2"]
      # exclude_detectors: ["URI", "JDBC"]

      # Live credential verification. Leave this off unless you have accepted
      # that it transmits candidate secrets to third-party APIs (AWS, GitHub,
      # ...) to test whether they are live, and adds their latency to every
      # request that contains a match.
      verify: false

  # Scan model output too. Streaming responses are handled by the withheld-tail
  # mechanism so a secret cannot be split across two chunks.
  - guardrail_name: trufflehog-response
    litellm_params:
      guardrail: litellm_trufflehog.TrufflehogGuardrail
      mode: post_call
      default_on: true
      on_detection: block
      profile: core

litellm_settings:
  set_verbose: false
